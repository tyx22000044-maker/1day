name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        # 固定来源和版本：runner 上预装了什么、Homebrew 装到哪个版本，
        # 都不该决定这条门禁是否真的执行。装不上或版本对不上就让 job 失败。
        env:
          SWIFTLINT_VERSION: 0.65.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          rm -rf /tmp/swiftlint
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint
          SWIFTLINT=/tmp/swiftlint/swiftlint
          test -x "$SWIFTLINT"
          chmod +x "$SWIFTLINT"
          test "$("$SWIFTLINT" version)" = "$SWIFTLINT_VERSION"
          "$SWIFTLINT" lint --quiet

      - name: Build
        run: |
          xcodebuild -project 1Day.xcodeproj -scheme 1Day \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild -project 1Day.xcodeproj -scheme 1Day \
            -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' \
            test CODE_SIGNING_ALLOWED=NO
