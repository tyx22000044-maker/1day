<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Settings — shared skeleton (PILOT SCOPE, 1Cash instance shown)</title>
  <!-- Standalone export from the Swiss Ledger prototype canvas. Static reference only. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #C4321F; }
    a:hover { color: #8f2416; }
    .screen{width:390px;background:#FAFAF7;color:#0B0B0A;font-family:'Archivo',-apple-system,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 18px 12px;}
    .brand{display:flex;align-items:center;gap:8px;}
    .mark{width:22px;height:22px;border:1px solid #0B0B0A;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;flex:none;}
    .wordmark{font-size:13px;font-weight:800;letter-spacing:.02em;}
    .navlabel{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6E6E68;}
    .profileband{background:#0B0B0A;color:#FAFAF7;margin:2px 18px 0;padding:16px;display:flex;align-items:center;gap:12px;}
    .avatar{width:38px;height:38px;border:1px solid rgba(250,250,247,0.5);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none;}
    .profileband .name{font-size:14px;font-weight:800;}
    .profileband .sub{font-size:9.5px;color:rgba(250,250,247,0.55);margin-top:4px;letter-spacing:.03em;}
    .sectionhead{padding:18px 18px 6px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6E6E68;}
    .srow{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid rgba(11,11,10,0.10);}
    .srow .lab{flex:1;font-size:13.5px;font-weight:600;}
    .srow .lab .sm{display:block;font-size:10px;color:#6E6E68;font-weight:500;margin-top:2px;}
    .srow .val{font-size:12px;color:#6E6E68;flex:none;}
    .srow .chev{width:7px;height:7px;border-right:1px solid #9C9B90;border-top:1px solid #9C9B90;transform:rotate(45deg);flex:none;margin-left:2px;}
    .tag{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid #0B0B0A;}
    .srow.danger .lab{font-weight:500;}
    .tabbar{margin-top:auto;display:flex;border-top:1px solid rgba(11,11,10,0.16);}
    .tab{flex:1;text-align:center;padding:10px 4px 12px;font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9C9B90;}
    .tab.on{color:#0B0B0A;}
    .aimark{width:20px;height:20px;color:#FAFAF7;display:flex;align-items:center;justify-content:center;margin:0 auto 3px;font-size:9px;font-weight:800;}
    .caption{padding:14px 18px 20px;font-size:9.5px;color:#9C9B90;letter-spacing:.03em;}
  </style>
</head>
<body>
<div class="screen">

  <div class="topbar">
    <div class="brand">
      <div class="mark">1C</div>
      <div class="wordmark">1CASH</div>
    </div>
    <div class="navlabel">设置 · SETTINGS</div>
  </div>

  <div class="profileband">
    <div class="avatar">Y</div>
    <div>
      <div class="name">Yun</div>
      <div class="sub">USER_ID 8F2C91 &middot; LOCAL-ONLY</div>
    </div>
  </div>

  <div class="sectionhead">AI Configuration</div>
  <div class="srow"><span class="lab">服务商<span class="sm">Provider</span></span><span class="tag">CONFIGURED</span></div>
  <div class="srow"><span class="lab">模型<span class="sm">Model</span></span><span class="val">Claude Sonnet 5</span><span class="chev"></span></div>
  <div class="srow"><span class="lab">API Key</span><span class="val">•••• 7F2A</span><span class="chev"></span></div>

  <div class="sectionhead">Data</div>
  <div class="srow"><span class="lab">导出数据<span class="sm">Export as JSON</span></span><span class="chev"></span></div>
  <div class="srow"><span class="lab">导入恢复<span class="sm">Import / Restore</span></span><span class="chev"></span></div>
  <div class="srow danger"><span class="lab" style="color:#C4321F;">清空所有数据</span></div>

  <div class="sectionhead">About</div>
  <div class="srow"><span class="lab">隐私政策</span><span class="chev"></span></div>
  <div class="srow"><span class="lab">用户手册</span><span class="chev"></span></div>
  <div class="srow"><span class="lab">版本</span><span class="val">2026.9.1</span></div>

  <div class="caption">共享 Settings 骨架 — 七个 App 结构完全一致，仅"1Cash 特有配置"一组内容随 App 变化</div>

  <div class="tabbar">
    <div class="tab">首页</div>
    <div class="tab">明细</div>
    <div class="tab"><div class="aimark" style="background:#C4321F;">AI</div></div>
    <div class="tab">报告</div>
    <div class="tab on">设置</div>
  </div>

</div>
</body>
</html>
