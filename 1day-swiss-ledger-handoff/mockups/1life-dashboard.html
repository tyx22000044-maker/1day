<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>1Life — Today Dashboard (reference only, not in pilot scope)</title>
  <!-- Standalone export from the Swiss Ledger prototype canvas. Static reference only. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #C4321F; }
    a:hover { color: #8f2416; }
    .screen{width:390px;background:#FAFAF7;color:#0B0B0A;font-family:'Archivo',-apple-system,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 18px 12px;}
    .brand{display:flex;align-items:center;gap:8px;}
    .mark{width:22px;height:22px;border:1px solid #0B0B0A;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;flex:none;}
    .wordmark{font-size:13px;font-weight:800;letter-spacing:.02em;}
    .navlabel{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6E6E68;}
    .hero{padding:8px 18px 16px;border-bottom:1px solid rgba(11,11,10,0.14);}
    .hero-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6E6E68;}
    .hero-value{font-size:34px;font-weight:800;letter-spacing:-0.01em;margin-top:3px;}
    .hero-value small{font-size:16px;font-weight:600;color:#6E6E68;}
    .tickline{height:2px;background:rgba(11,11,10,0.12);margin-top:11px;position:relative;}
    .tickline i{position:absolute;left:0;top:0;height:100%;display:block;}
    .macros{padding:14px 18px 4px;border-bottom:1px solid rgba(11,11,10,0.14);}
    .macro{display:flex;align-items:center;gap:10px;padding:6px 0;}
    .macro .lab{width:64px;flex:none;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6E6E68;}
    .macro .track{flex:1;height:3px;background:rgba(11,11,10,0.10);position:relative;}
    .macro .track i{position:absolute;left:0;top:0;height:100%;background:#0B0B0A;display:block;}
    .macro .val{width:68px;flex:none;text-align:right;font-size:11px;font-weight:600;color:#0B0B0A;}
    .sectionhead{display:flex;justify-content:space-between;align-items:baseline;padding:13px 18px 6px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
    .sectionhead .count{color:#6E6E68;font-weight:600;}
    .row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(11,11,10,0.10);}
    .row-mark{width:8px;height:8px;border:1px solid #0B0B0A;flex:none;}
    .row-text{flex:1;min-width:0;}
    .row-text .t{font-size:13.5px;font-weight:600;}
    .row-text .m{font-size:10.5px;color:#6E6E68;margin-top:2px;}
    .row-val{text-align:right;flex:none;}
    .row-val .v{font-size:13.5px;font-weight:700;}
    .tag{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid #0B0B0A;margin-top:4px;}
    .tabbar{margin-top:auto;display:flex;border-top:1px solid rgba(11,11,10,0.16);}
    .tab{flex:1;text-align:center;padding:10px 4px 12px;font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9C9B90;}
    .tab.on{color:#0B0B0A;}
    .aimark{width:20px;height:20px;color:#FAFAF7;display:flex;align-items:center;justify-content:center;margin:0 auto 3px;font-size:9px;font-weight:800;}
    .caption{padding:10px 18px 20px;font-size:9.5px;color:#9C9B90;letter-spacing:.03em;}
  </style>
</head>
<body>
<div class="screen">

  <div class="topbar">
    <div class="brand">
      <div class="mark">1L</div>
      <div class="wordmark">1LIFE</div>
    </div>
    <div class="navlabel">今日 · TODAY</div>
  </div>

  <div class="hero">
    <div class="hero-label">Intake — Dec 24</div>
    <div class="hero-value">1,420<small>&nbsp;/&nbsp;2,000 kcal</small></div>
    <div class="tickline"><i style="width:71%;background:#C4321F;"></i></div>
  </div>

  <div class="macros">
    <div class="macro"><span class="lab">Protein</span><span class="track"><i style="width:68%;"></i></span><span class="val">82 / 120g</span></div>
    <div class="macro"><span class="lab">Carbs</span><span class="track"><i style="width:64%;"></i></span><span class="val">140 / 220g</span></div>
    <div class="macro"><span class="lab">Fat</span><span class="track"><i style="width:58%;"></i></span><span class="val">38 / 65g</span></div>
  </div>

  <div class="sectionhead"><span>Meals — Today</span><span class="count">Vol 04</span></div>
  <div class="row">
    <span class="row-mark filled"></span>
    <span class="row-text"><span class="t">早餐</span><span class="m">07:40</span></span>
    <span class="row-val"><span class="v">320 kcal</span><br><span class="tag">LOGGED</span></span>
  </div>
  <div class="row">
    <span class="row-mark filled"></span>
    <span class="row-text"><span class="t">午餐</span><span class="m">12:20</span></span>
    <span class="row-val"><span class="v">540 kcal</span><br><span class="tag">LOGGED</span></span>
  </div>
  <div class="row">
    <span class="row-mark" style="border-color:#C4321F;"></span>
    <span class="row-text"><span class="t">晚餐</span><span class="m">尚未记录</span></span>
    <span class="row-val"><span class="v">—</span><br><span class="tag" style="color:#C4321F;border-color:#C4321F;">UNSET</span></span>
  </div>
  <div class="row">
    <span class="row-mark filled"></span>
    <span class="row-text"><span class="t">加餐</span><span class="m">15:10</span></span>
    <span class="row-val"><span class="v">180 kcal</span><br><span class="tag">PHOTO</span></span>
  </div>

  <div class="caption">1Life 旗舰屏 — Today Dashboard · 宏量素用细线条，不用环形图</div>

  <div class="tabbar">
    <div class="tab on">今日</div>
    <div class="tab">饮食</div>
    <div class="tab"><div class="aimark" style="background:#C4321F;">AI</div></div>
    <div class="tab">我的</div>
    <div class="tab">设置</div>
  </div>

</div>
</body>
</html>
