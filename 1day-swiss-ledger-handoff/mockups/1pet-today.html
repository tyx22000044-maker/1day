<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>1Pet — Today (reference only, not in pilot scope)</title>
  <!-- Standalone export from the Swiss Ledger prototype canvas. Static reference only. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #C4321F; }
    a:hover { color: #8f2416; }
    .screen{width:390px;background:#FAFAF7;color:#0B0B0A;font-family:'Archivo',-apple-system,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 18px 12px;}
    .brand{display:flex;align-items:center;gap:8px;}
    .mark{width:22px;height:22px;border:1px solid #0B0B0A;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;flex:none;}
    .wordmark{font-size:13px;font-weight:800;letter-spacing:.02em;}
    .navlabel{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6E6E68;}
    .petstrip{display:flex;gap:8px;padding:0 18px 14px;}
    .petchip{border:1px solid #0B0B0A;padding:5px 12px;font-size:11px;font-weight:700;}
    .petchip.off{border-color:rgba(11,11,10,0.28);color:#6E6E68;font-weight:600;}
    .hero{padding:0 18px 14px;border-bottom:1px solid rgba(11,11,10,0.14);}
    .hero-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6E6E68;}
    .hero-value{font-size:34px;font-weight:800;letter-spacing:-0.01em;margin-top:3px;}
    .hero-value small{font-size:15px;font-weight:600;color:#6E6E68;}
    .tickline{height:2px;background:rgba(11,11,10,0.12);margin-top:11px;position:relative;}
    .tickline i{position:absolute;left:0;top:0;height:100%;display:block;}
    .hero-stats{display:flex;gap:26px;margin-top:12px;}
    .hero-stats div{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#6E6E68;}
    .hero-stats b{display:block;font-size:14px;font-weight:700;color:#0B0B0A;letter-spacing:0;text-transform:none;margin-top:2px;}
    .sectionhead{display:flex;justify-content:space-between;align-items:baseline;padding:13px 18px 6px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
    .sectionhead .count{color:#6E6E68;font-weight:600;}
    .row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(11,11,10,0.10);}
    .row-mark{width:8px;height:8px;border:1px solid #0B0B0A;flex:none;}
    .row-mark.filled{background:#0B0B0A;}
    .row-text{flex:1;min-width:0;}
    .row-text .t{font-size:13.5px;font-weight:600;}
    .row-text .m{font-size:10.5px;color:#6E6E68;margin-top:2px;}
    .row-val{text-align:right;flex:none;}
    .tag{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid #0B0B0A;}
    .tabbar{margin-top:auto;display:flex;border-top:1px solid rgba(11,11,10,0.16);}
    .tab{flex:1;text-align:center;padding:10px 4px 12px;font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9C9B90;}
    .tab.on{color:#0B0B0A;}
    .aimark{width:20px;height:20px;color:#FAFAF7;display:flex;align-items:center;justify-content:center;margin:0 auto 3px;font-size:9px;font-weight:800;}
    .caption{padding:10px 18px 20px;font-size:9.5px;color:#9C9B90;letter-spacing:.03em;}
  </style>
</head>
<body>
<div class="screen">

  <div class="topbar">
    <div class="brand">
      <div class="mark">PE</div>
      <div class="wordmark">1PET</div>
    </div>
    <div class="navlabel">今日 · TODAY</div>
  </div>

  <div class="petstrip">
    <span class="petchip">豆豆</span>
    <span class="petchip off">咪咪</span>
  </div>

  <div class="hero">
    <div class="hero-label">Care Tasks — 豆豆</div>
    <div class="hero-value">2<small>&nbsp;/&nbsp;3 done</small></div>
    <div class="tickline"><i style="width:66%;background:#C4321F;"></i></div>
    <div class="hero-stats">
      <div>Overdue<b>1</b></div>
      <div>本月开销<b>¥340</b></div>
      <div>下次疫苗<b>10/03</b></div>
    </div>
  </div>

  <div class="sectionhead"><span>Today — Dec 24</span><span class="count">Vol 03</span></div>
  <div class="row">
    <span class="row-mark filled"></span>
    <span class="row-text"><span class="t">早餐喂食</span><span class="m">08:00</span></span>
    <span class="row-val"><span class="tag">DONE</span></span>
  </div>
  <div class="row">
    <span class="row-mark" style="border-color:#C4321F;"></span>
    <span class="row-text"><span class="t">心丝虫药</span><span class="m">逾期 1 天</span></span>
    <span class="row-val"><span class="tag" style="color:#C4321F;border-color:#C4321F;">OVERDUE</span></span>
  </div>
  <div class="row">
    <span class="row-mark"></span>
    <span class="row-text"><span class="t">遛狗 · 30 分钟</span><span class="m">18:00</span></span>
    <span class="row-val"><span class="tag">PENDING</span></span>
  </div>

  <div class="sectionhead"><span>Health Snapshot</span><span class="count">Vol 02</span></div>
  <div class="row">
    <span class="row-mark filled"></span>
    <span class="row-text"><span class="t">上次体检</span><span class="m">2026-08-12</span></span>
    <span class="row-val"><span class="tag">LOGGED</span></span>
  </div>
  <div class="row">
    <span class="row-mark"></span>
    <span class="row-text"><span class="t">狂犬疫苗提醒</span><span class="m">2026-10-03</span></span>
    <span class="row-val"><span class="tag">SCHEDULED</span></span>
  </div>

  <div class="caption">1Pet 旗舰屏 — Today · 多宠物切换用顶部 chip，不用 Segmented Control</div>

  <div class="tabbar">
    <div class="tab on">今日</div>
    <div class="tab">宠物</div>
    <div class="tab"><div class="aimark" style="background:#C4321F;">AI</div></div>
    <div class="tab">记录</div>
    <div class="tab">设置</div>
  </div>

</div>
</body>
</html>
