# 1App Family 统一规则：宽阈值 + 只报真问题，避免噪音淹没信号。
disabled_rules:
  - todo
  - trailing_whitespace
  - nesting
opt_in_rules:
  - empty_count
  - redundant_nil_coalescing
  - first_where

line_length:
  warning: 160
  error: 300
  ignores_comments: true

file_length:
  warning: 1000
  error: 2500
  ignore_comment_only_lines: true

type_body_length:
  warning: 800
  error: 1600

function_body_length:
  warning: 120
  error: 300

cyclomatic_complexity:
  warning: 25
  error: 50

identifier_name:
  min_length: 1
  excluded: [id, x, y, dx, dy, i, j, n, to, up]

reporter: xcode
